name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: docker compose up --build --detach
      - name: Wait for the application
        run: |
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/ && exit 0
            sleep 15
          done
          docker compose logs
          exit 1
      - run: TEST_BASE_URL=http://127.0.0.1:3000 npm run test:smoke
      - if: always()
        run: docker compose down --volumes

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run supabase:reset
      - run: npx supabase db lint --local
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: npx supabase stop --no-backup
