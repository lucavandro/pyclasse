name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: docker compose up --build --detach
      - name: Wait for the application
        run: |
          for attempt in {1..30}; do
            curl --fail --silent --show-error --max-time 30 http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 10
          done
          docker compose logs
          exit 1
      - name: Run container smoke tests
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          SMOKE_REQUEST_TIMEOUT_MS: 60000
        run: npm run test:smoke
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run supabase:reset
      - run: npx supabase db lint --local
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: npx supabase stop --no-backup
